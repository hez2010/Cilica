name: Compiler CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
        invariant: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Cilica.slnx
      - run: dotnet build Cilica.slnx --no-restore -c ${{ matrix.configuration }} -p:InvariantGlobalization=${{ matrix.invariant }}
      - run: dotnet test Cilica.slnx --no-build --no-restore -c ${{ matrix.configuration }} -p:InvariantGlobalization=${{ matrix.invariant }} --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.invariant }}
          path: artifacts/test-results
